name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ================= CHECKOUT =================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ================= FLUTTER =================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'

      # ================= CACHE DEPENDENCIES =================
      - name: Cache Flutter Pub
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            .packages
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      # ================= KEYSTORE =================
      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/dirigenten_key.jks
          ls -l android/app

      # ================= KEY.PROPERTIES =================
      - name: Create key.properties
        run: |
          cat <<EOF > android/app/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=dirigenten_key.jks
          EOF

      # ================= VERIFY KEYSTORE =================
      - name: Verify keystore alias
        run: |
          keytool -list \
            -keystore android/app/dirigenten_key.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}"

      # ================= GET NEXT RELEASE NUMBER =================
      - name: Determine next release number
        id: next_release
        run: |
          FILES_XML=$(curl -s -u "${{ secrets.NC_USER }}:${{ secrets.NC_PASS }}" \
            -X PROPFIND \
            "https://cloud.notenserver.duckdns.org/remote.php/dav/files/mwesterh/releases/")
          VERSIONS=$(echo "$FILES_XML" | grep -oP 'dirigenten_application-\K(\d+\.\d+\.\d+)(?=\.apk)')
          if [ -z "$VERSIONS" ]; then
            NEXT="0.0.1"
          else
            LAST=$(echo "$VERSIONS" | sort -V | tail -n1)
            MAJOR=$(echo $LAST | cut -d. -f1)
            MINOR=$(echo $LAST | cut -d. -f2)
            PATCH=$(echo $LAST | cut -d. -f3)
            PATCH=$((PATCH+1))
            NEXT="$MAJOR.$MINOR.$PATCH"
          fi
          echo "next_release=$NEXT" >> $GITHUB_OUTPUT
          echo "Next release version: $NEXT"

      # GitHub Actions Schritt
      - name: Create .env
        run: |
          cat <<EOF > .env
          API_URL=${{ secrets.API_URL }}
          NC_USER=${{ secrets.NC_USER }}
          NC_PASS=${{ secrets.NC_PASS }}
          EOF


      # ================= BUILD =================
      - name: Build APK (release)
        run: |
          flutter clean
          flutter build apk --release \
            --build-name=${{ steps.next_release.outputs.next_release }} \
            --build-number=$(date +%s) \
            --no-tree-shake-icons

      # ================= RENAME APK =================
      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             dirigenten_application-${{ steps.next_release.outputs.next_release }}.apk

      # ================= NEXTCLOUD =================
      - name: Ensure releases folder exists
        run: |
          curl -u "${{ secrets.NC_USER }}:${{ secrets.NC_PASS }}" \
               -X MKCOL \
               "https://cloud.notenserver.duckdns.org/remote.php/dav/files/mwesterh/releases" \
          || true

      - name: Upload APK to Nextcloud
        run: |
          curl -u "${{ secrets.NC_USER }}:${{ secrets.NC_PASS }}" \
               -T dirigenten_application-${{ steps.next_release.outputs.next_release }}.apk \
               "https://cloud.notenserver.duckdns.org/remote.php/dav/files/mwesterh/releases/dirigenten_application-${{ steps.next_release.outputs.next_release }}.apk"

      # ================= OCTOPUS DEPLOY =================
      - name: Install GitHub CLI (recommended)
        run: |
          type -p curl >/dev/null || sudo apt-get install curl -y
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /usr/share/keyrings/githubcli.gpg > /dev/null
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Create Octopus Release
        env:
          OCTOPUS_URL: https://franky.octopus.app
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          OCTOPUS_SPACE: ${{ secrets.OCTOPUS_SPACE }}
        run: |
          ./octo create-release \
            --project "dirigenten_application" \
            --version "${{ steps.next_release.outputs.next_release }}" \
            --server "$OCTOPUS_URL" \
            --apiKey "$OCTOPUS_API_KEY" \
            --space "$OCTOPUS_SPACE" \
            --packageVersion "${{ steps.next_release.outputs.next_release }}" \
            --releaseNotes "APK Release v${{ steps.next_release.outputs.next_release }}"

      - name: Deploy Release to Octopus
        env:
          OCTOPUS_URL: https://franky.octopus.app
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          OCTOPUS_SPACE: ${{ secrets.OCTOPUS_SPACE }}
        run: |
          ./octo deploy-release \
            --project "dirigenten_application" \
            --version "${{ steps.next_release.outputs.next_release }}" \
            --server "$OCTOPUS_URL" \
            --apiKey "$OCTOPUS_API_KEY" \
            --space "$OCTOPUS_SPACE" \
            --deployTo "Production"

      # ================= NOTIFY SERVER =================
      - name: Notify Noten Server (WebSocket)
        run: |
          wget -O websocat https://github.com/vi/websocat/releases/latest/download/websocat.x86_64-unknown-linux-musl
          chmod +x websocat
          ./websocat -n1 wss://ws.notenserver.duckdns.org <<< \
          '{"type":"release_announce","app":"dirigenten_application","version":"${{ steps.next_release.outputs.next_release }}","apkUrl":"https://cloud.notenserver.duckdns.org/remote.php/dav/files/mwesterh/releases/dirigenten_application-${{ steps.next_release.outputs.next_release }}.apk"}'
