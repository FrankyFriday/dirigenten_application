name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ================= CHECKOUT =================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ================= FLUTTER =================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'

      # ================= CACHE DEPENDENCIES =================
      - name: Cache Flutter Pub
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            .packages
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      # ================= KEYSTORE =================
      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/dirigenten_key.jks
          ls -l android/app

      # ================= KEY.PROPERTIES =================
      - name: Create key.properties
        run: |
          cat <<EOF > android/app/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=dirigenten_key.jks
          EOF

      # ================= VERIFY KEYSTORE =================
      - name: Verify keystore alias
        run: |
          keytool -list \
            -keystore android/app/dirigenten_key.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}"

      # ================= GET NEXT RELEASE NUMBER =================
      - name: Determine next release number
        id: next_release
        env:
          NC_USER: ${{ secrets.NC_USER }}
          NC_PASS: ${{ secrets.NC_PASS }}
        run: |
          FILES_XML=$(curl -s -u "${NC_USER}:${NC_PASS}" \
            -X PROPFIND \
            "https://cloud.notenserver.duckdns.org/remote.php/dav/files/mwesterh/releases/")

          VERSIONS=$(echo "$FILES_XML" | grep -oP 'dirigenten_application-\K(\d+\.\d+\.\d+)(?=\.apk)')

          if [ -z "$VERSIONS" ]; then
            NEXT="0.0.1"
          else
            LAST=$(echo "$VERSIONS" | sort -V | tail -n1)
            MAJOR=$(echo $LAST | cut -d. -f1)
            MINOR=$(echo $LAST | cut -d. -f2)
            PATCH=$(echo $LAST | cut -d. -f3)
            PATCH=$((PATCH+1))
            NEXT="$MAJOR.$MINOR.$PATCH"
          fi

          echo "next_release=$NEXT" >> $GITHUB_OUTPUT
          echo "Next release version: $NEXT"

      # ================= CREATE .ENV =================
      # WICHTIG: Nur Werte hier rein, die im APK landen DÜRFEN.
      # NC_USER/NC_PASS wurden entfernt - die landen sonst im Klartext im
      # kompilierten APK und lassen sich mit jedem Decompiler auslesen.
      # Falls die App selbst Zugriff auf Nextcloud braucht, das über einen
      # eigenen Server-Endpoint absichern statt Credentials im Client.
      - name: Create .env
        run: |
          cat <<EOF > .env
          API_URL=${{ secrets.API_URL }}
          EOF

      # ================= BUILD =================
      - name: Build APK (release)
        run: |
          flutter clean
          flutter build apk --release \
            --build-name=${{ steps.next_release.outputs.next_release }} \
            --build-number=$(date +%s) \
            --no-tree-shake-icons

      # ================= RENAME APK =================
      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
            dirigenten_application-${{ steps.next_release.outputs.next_release }}.apk

      # ================= OCTOPUS DEPLOY =================
      - name: Install Octopus CLI
        uses: OctopusDeploy/install-octopus-cli-action@v3
        with:
          version: latest
          
      - name: Zip APK for Octopus
        run: |
          cd build/app/outputs/flutter-apk
          zip "dirigenten_application-${{ steps.next_release.outputs.next_release }}.zip" app-release.apk
          mv "dirigenten_application-${{ steps.next_release.outputs.next_release }}.zip" $GITHUB_WORKSPACE/

      - name: Push package to Octopus
        env:
          OCTOPUS_URL: https://franky.octopus.app
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          OCTOPUS_SPACE: ${{ secrets.OCTOPUS_SPACE }}
        run: |
          octopus package push \
            --package dirigenten_application-${{ steps.next_release.outputs.next_release }}.zip \
            --overwrite-mode OverwriteExisting

      - name: Create Octopus Release
        env:
          OCTOPUS_URL: https://franky.octopus.app
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          OCTOPUS_SPACE: ${{ secrets.OCTOPUS_SPACE }}
        run: |
          octopus release create \
            --project "dirigenten_application" \
            --version "${{ steps.next_release.outputs.next_release }}" \
            --package "dirigenten_application:${{ steps.next_release.outputs.next_release }}" \
            --release-notes "APK Release"

      - name: Deploy Release to Octopus
        env:
          OCTOPUS_URL: https://franky.octopus.app
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          OCTOPUS_SPACE: ${{ secrets.OCTOPUS_SPACE }}
        run: |
          octopus release deploy \
            --project "dirigenten_application" \
            --version "${{ steps.next_release.outputs.next_release }}" \
            --environment "Production"
