name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ================= CHECKOUT =================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ================= FLUTTER =================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.7"


      # ================= CACHE DEPENDENCIES =================
      - name: Cache Flutter Pub
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            .packages
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-


      # ================= INSTALL DEPENDENCIES =================
      - name: Install dependencies
        run: |
          flutter pub get


      # ================= KEYSTORE =================
      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/dirigenten_key.jks

          ls -lh android/app/dirigenten_key.jks


      # ================= KEY.PROPERTIES =================
      - name: Create key.properties
        run: |
          cat <<EOF > android/app/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=dirigenten_key.jks
          EOF


      # ================= VERIFY KEYSTORE =================
      - name: Verify keystore alias
        run: |
          keytool -list \
            -keystore android/app/dirigenten_key.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}"


      # ================= GET NEXT RELEASE NUMBER =================
      - name: Determine next release number
        id: next_release
        env:
          NC_USER: ${{ secrets.NC_USER }}
          NC_PASS: ${{ secrets.NC_PASS }}
        run: |

          echo "Checking existing releases..."

          FILES_XML=$(curl -fsS \
            -u "${NC_USER}:${NC_PASS}" \
            -X PROPFIND \
            "https://cloud.notenserver.duckdns.org/remote.php/dav/files/mwesterh/releases/")

          VERSIONS=$(echo "$FILES_XML" \
            | grep -oP 'dirigenten_application-\K(\d+\.\d+\.\d+)(?=\.apk)' \
            | sort -V \
            | uniq)

          if [ -z "$VERSIONS" ]; then
            NEXT="0.0.1"
          else
            LAST=$(echo "$VERSIONS" | tail -n 1)

            MAJOR=$(echo "$LAST" | cut -d. -f1)
            MINOR=$(echo "$LAST" | cut -d. -f2)
            PATCH=$(echo "$LAST" | cut -d. -f3)

            PATCH=$((PATCH + 1))

            NEXT="$MAJOR.$MINOR.$PATCH"
          fi

          echo "Last version: ${LAST:-none}"
          echo "Next release version: $NEXT"

          echo "next_release=$NEXT" >> "$GITHUB_OUTPUT"


      # ================= CREATE .ENV =================
      # WICHTIG:
      # Keine Nextcloud-Benutzer/Passwörter ins APK schreiben.
      # Diese Credentials bleiben ausschließlich in GitHub Secrets.
      - name: Create .env
        run: |
          cat <<EOF > .env
          API_URL=${{ secrets.API_URL }}
          NEXTCLOUD_BASE_URL=https://cloud.notenserver.duckdns.org/remote.php/dav/files/mwesterh
          EOF


      # ================= BUILD =================
      - name: Build APK (release)
        run: |
          VERSION="${{ steps.next_release.outputs.next_release }}"

          echo "Building APK version: $VERSION"

          flutter clean

          flutter pub get

          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="$(date +%s)" \
            --no-tree-shake-icons


      # ================= ANDROID BUILD TOOLS =================
      - name: Setup Android Build Tools
        run: |

          echo "ANDROID_HOME: $ANDROID_HOME"

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)

          echo "Using Android Build Tools: $BUILD_TOOLS"

          echo "$ANDROID_HOME/build-tools/$BUILD_TOOLS" >> "$GITHUB_PATH"


      # ================= VERIFY APK VERSION =================
      - name: Verify APK version
        env:
          EXPECTED_VERSION: ${{ steps.next_release.outputs.next_release }}
        run: |

          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo "APK: $APK"
          echo "Expected version: $EXPECTED_VERSION"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK does not exist!"
            exit 1
          fi

          APK_VERSION=$(aapt dump badging "$APK" \
            | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")

          echo "APK version: $APK_VERSION"
          echo "Expected version: $EXPECTED_VERSION"

          if [ -z "$APK_VERSION" ]; then
            echo "ERROR: Could not determine APK version!"
            exit 1
          fi

          if [ "$APK_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "ERROR: APK version does not match expected version!"
            echo "APK:      $APK_VERSION"
            echo "Expected: $EXPECTED_VERSION"
            exit 1
          fi

          echo "========================================"
          echo "APK VERSION VERIFIED"
          echo "Version: $APK_VERSION"
          echo "========================================"


      # ================= RENAME APK =================
      - name: Rename APK
        run: |

          VERSION="${{ steps.next_release.outputs.next_release }}"

          mv \
            build/app/outputs/flutter-apk/app-release.apk \
            "dirigenten_application-${VERSION}.apk"

          ls -lh "dirigenten_application-${VERSION}.apk"


      # ================= NEXTCLOUD =================
      - name: Ensure releases folder exists
        env:
          NC_USER: ${{ secrets.NC_USER }}
          NC_PASS: ${{ secrets.NC_PASS }}
        run: |

          curl -fsS \
            -u "${NC_USER}:${NC_PASS}" \
            -X MKCOL \
            "https://cloud.notenserver.duckdns.org/remote.php/dav/files/mwesterh/releases" \
            || true


      # ================= UPLOAD APK TO NEXTCLOUD =================
      - name: Upload APK to Nextcloud
        env:
          NC_USER: ${{ secrets.NC_USER }}
          NC_PASS: ${{ secrets.NC_PASS }}
        run: |

          VERSION="${{ steps.next_release.outputs.next_release }}"

          APK="dirigenten_application-${VERSION}.apk"

          echo "Uploading: $APK"

          curl -fS \
            -u "${NC_USER}:${NC_PASS}" \
            -T "$APK" \
            "https://cloud.notenserver.duckdns.org/remote.php/dav/files/mwesterh/releases/$APK"

          echo "Upload completed successfully."


      # ================= OCTOPUS CLI =================
      - name: Install Octopus CLI
        uses: OctopusDeploy/install-octopus-cli-action@v3
        with:
          version: latest


      # ================= OCTOPUS RELEASE =================
      - name: Create Octopus Release
        env:
          OCTOPUS_URL: https://franky.octopus.app
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          OCTOPUS_SPACE: ${{ secrets.OCTOPUS_SPACE }}
        run: |

          VERSION="${{ steps.next_release.outputs.next_release }}"

          echo "Creating Octopus release: $VERSION"

          octopus release create \
            --project "dirigenten_application" \
            --version "$VERSION" \
            --release-notes "APK Release $VERSION"


      # ================= OCTOPUS DEPLOY =================
      - name: Deploy Release to Octopus
        env:
          OCTOPUS_URL: https://franky.octopus.app
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          OCTOPUS_SPACE: ${{ secrets.OCTOPUS_SPACE }}
        run: |

          VERSION="${{ steps.next_release.outputs.next_release }}"

          echo "Deploying Octopus release: $VERSION"

          octopus release deploy \
            --project "dirigenten_application" \
            --version "$VERSION" \
            --environment "Production"

          echo "========================================"
          echo "RELEASE DEPLOYED"
          echo "Version: $VERSION"
          echo "========================================"