name: Repair Octopus notify step

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Confirm patching the Production Notify Server process step
        required: true
        type: boolean
        default: false
      version:
        description: Release version to deploy
        required: true
        type: string
        default: "1.0.11"
      project:
        description: Octopus project whose release should be repaired
        required: true
        type: choice
        options:
          - dirigenten_application
          - musiker_application
        default: musiker_application
      deploy:
        description: Start the Production deployment after repairing the process
        required: true
        type: boolean
        default: true
      sync_server_key:
        description: Update the project's sensitive Production NotenServerApiKey variable
        required: true
        type: boolean
        default: false
      channel_id:
        description: Octopus channel ID (leave empty to use the project's default channel)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  repair-and-deploy:
    runs-on: ubuntu-latest
    env:
      OCTOPUS_URL: https://franky.octopus.app
      OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
      OCTOPUS_SPACE: ${{ secrets.OCTOPUS_SPACE }}
      VERSION: ${{ inputs.version }}
      PROJECT: ${{ inputs.project }}
      CONFIRM: ${{ inputs.confirm }}
      CHANNEL_ID: ${{ inputs.channel_id }}

    steps:
      - name: Repair project release-version variables
        shell: bash
        run: |
          set -euo pipefail
          for name in OCTOPUS_API_KEY OCTOPUS_SPACE VERSION; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required setting $name is missing."
              exit 1
            fi
          done
          if [[ "$CONFIRM" != "true" ]]; then
            echo "::error::Set the confirm input to true to update the Production process."
            exit 1
          fi

          api_get() {
            curl --fail --silent --show-error \
              -H "X-Octopus-ApiKey: $OCTOPUS_API_KEY" \
              -H 'Accept: application/json' "$1"
          }

          spaces="$(api_get "$OCTOPUS_URL/api/spaces/all")"
          space_id="$(jq -er --arg value "$OCTOPUS_SPACE" \
            '.[] | select(.Id == $value or .Name == $value) | .Id' \
            <<< "$spaces" | head -n 1)"
          projects="$(api_get "$OCTOPUS_URL/api/$space_id/projects/all")"
          project="$(jq -cer --arg name "$PROJECT" \
            '.[] | select(.Name == $name)' \
            <<< "$projects")"
          process_id="$(jq -er '.DeploymentProcessId' <<< "$project")"
          process_url="$OCTOPUS_URL/api/$space_id/deploymentprocesses/$process_id"
          process="$(api_get "$process_url")"
          if ! jq -e '.Steps | type == "array"' <<< "$process" >/dev/null; then
            response_keys="$(jq -r 'keys | join(", ")' <<< "$process")"
            steps_type="$(jq -r '.Steps | type' <<< "$process")"
            echo "::error::Octopus returned an unexpected deployment-process shape (keys: $response_keys; Steps type: $steps_type)."
            exit 1
          fi
          old_count="$(jq -er \
            '[.Steps[].Actions[] | .. | strings | select(contains("#{Release.Version}"))] | length' \
            <<< "$process")"
          if [[ "$old_count" != "0" ]]; then
            patched="$(jq \
              '(.Steps[].Actions[]) |= walk(if type == "string" then gsub("#\\{Release\\.Version\\}"; "#{Octopus.Release.Number}") else . end)' \
              <<< "$process")"
            curl --fail --silent --show-error \
              -X PUT \
              -H "X-Octopus-ApiKey: $OCTOPUS_API_KEY" \
              -H 'Content-Type: application/json' \
              --data-binary "$patched" \
              -o /dev/null "$process_url"
          else
            echo "No unresolved Octopus Release.Version token was found."
          fi

          verified="$(api_get "$process_url")"
          remaining="$(jq -er \
            '[.Steps[].Actions[] | .. | strings | select(contains("#{Release.Version}"))] | length' \
            <<< "$verified")"
          if [[ "$remaining" != "0" ]]; then
            echo "::error::Octopus process still contains the unresolved token."
            exit 1
          fi
          echo "Verified the release-version token in the $PROJECT Production process."
          variable_set_id="$(jq -er '.VariableSetId' <<< "$project")"
          variables="$(api_get "$OCTOPUS_URL/api/$space_id/variables/$variable_set_id")"
          echo "Relevant Octopus project variable names/scopes (values intentionally withheld):"
          jq -r \
            '.Variables[]? | select(.Name | test("noten|server|api|key|apkurl"; "i")) | [.Name, (.IsSensitive // false | tostring), ((.Scope.Environment // []) | join(","))] | @tsv' \
            <<< "$variables"
          echo "Deployment action variable references:"
          jq -r \
            '[.Steps[].Actions[] | .Properties[]? | strings | scan("#\\{[^}]+\\}")] | unique | .[]' \
            <<< "$verified"
          jq -r '.Steps[] | "Step: \(.Name)", (.Actions[]? | "  Action: \(.Name) [\(.ActionType // "unknown")]")' <<< "$verified"
          default_channel_id="$(jq -r '.DefaultChannelId // empty' <<< "$project")"
          if [[ -n "$default_channel_id" ]]; then
            channel="$(api_get "$OCTOPUS_URL/api/$space_id/channels/$default_channel_id")"
            echo "Project default release channel: $(jq -r '.Name' <<< "$channel")"
            echo "Project default release channel ID: $default_channel_id"
          else
            echo "Project has no default release channel."
          fi
          project_id="$(jq -er '.Id' <<< "$project")"
          channels="$(api_get "$OCTOPUS_URL/api/$space_id/projects/$project_id/channels")"
          echo "Project release channels:"
          jq -r '[if type == "array" then .[] else .Items[]? end | [.Id, .Name, (.IsDefault // false | tostring)]][] | @tsv' <<< "$channels"
          apk_url="$(jq -r '.Variables[]? | select(.Name == "ApkUrl" and (.IsSensitive // false) == false) | .Value' <<< "$variables" | head -n 1)"
          if [[ -n "$apk_url" ]]; then
            apk_url="$(APK_URL="$apk_url" VERSION="$VERSION" python3 -c 'import os,re; u=os.environ["APK_URL"]; v=os.environ["VERSION"]; print(u.replace("#{Octopus.Release.Number}",v).replace("#{Release.Version}",v))')"
            http_code="$(curl --location --silent --show-error --output /dev/null \
              --range 0-0 --write-out '%{http_code}' "$apk_url")"
            if [[ "$http_code" != "200" && "$http_code" != "206" ]]; then
              echo "::error::The configured musician APK URL is unavailable for version $VERSION (HTTP $http_code)."
              exit 1
            fi
            APK_URL="$apk_url" VERSION="$VERSION" python3 -c 'from urllib.parse import urlparse; import os; u=urlparse(os.environ["APK_URL"]); print("ApkUrl host:", u.hostname or "unset"); print("APK URL reachable:", "yes"); print("APK URL version matches requested release:", "yes" if os.environ["VERSION"] in u.path or os.environ["VERSION"] in u.query else "no")'
          else
            echo "No non-sensitive ApkUrl value was found."
          fi

      - name: Install Octopus CLI
        if: inputs.deploy || inputs.sync_server_key
        uses: OctopusDeploy/install-octopus-cli-action@v3
        with:
          version: latest

      - name: Sync the sensitive Production server API key
        if: inputs.sync_server_key
        env:
          NOTEN_SERVER_API_KEY: ${{ secrets.NOTEN_SERVER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$NOTEN_SERVER_API_KEY" ]]; then
            echo "::error::The NOTEN_SERVER_API_KEY repository secret is not configured."
            exit 1
          fi

          api_get() {
            curl --fail --silent --show-error \
              -H "X-Octopus-ApiKey: $OCTOPUS_API_KEY" \
              -H 'Accept: application/json' "$1"
          }
          spaces="$(api_get "$OCTOPUS_URL/api/spaces/all")"
          space_id="$(jq -er --arg value "$OCTOPUS_SPACE" \
            '.[] | select(.Id == $value or .Name == $value) | .Id' \
            <<< "$spaces" | head -n 1)"
          projects="$(api_get "$OCTOPUS_URL/api/$space_id/projects/all")"
          project="$(jq -cer --arg name "$PROJECT" \
            '.[] | select(.Name == $name)' <<< "$projects")"
          project_id="$(jq -er '.Id' <<< "$project")"
          variable_set_id="$(jq -er '.VariableSetId' <<< "$project")"
          environments="$(api_get "$OCTOPUS_URL/api/$space_id/environments/all")"
          production_id="$(jq -er \
            '.[] | select(.Name == "Production") | .Id' <<< "$environments")"
          variables="$(api_get "$OCTOPUS_URL/api/$space_id/variables/$variable_set_id")"
          variable_ids="$(jq -er --arg production "$production_id" \
            '[.Variables[]? | select(.Name == "NotenServerApiKey") | select((.Scope.Environment // []) | index($production)) | .Id] | .[]' \
            <<< "$variables")"
          variable_count="$(wc -l <<< "$variable_ids" | tr -d ' ')"
          if [[ "$variable_count" != "1" ]]; then
            echo "::error::Expected exactly one Production-scoped NotenServerApiKey variable in $PROJECT; found $variable_count."
            exit 1
          fi
          octopus project variables update NotenServerApiKey \
            --project "$project_id" \
            --id "$variable_ids" \
            --value "$NOTEN_SERVER_API_KEY" \
            --no-prompt
          echo "Updated the sensitive Production NotenServerApiKey value for $PROJECT."

      - name: Recreate release with the updated Production variable snapshot
        if: inputs.deploy
        shell: bash
        run: |
          set -euo pipefail
          api_get() {
            curl --fail --silent --show-error \
              -H "X-Octopus-ApiKey: $OCTOPUS_API_KEY" \
              -H 'Accept: application/json' "$1"
          }

          spaces="$(api_get "$OCTOPUS_URL/api/spaces/all")"
          space_id="$(jq -er --arg value "$OCTOPUS_SPACE" \
            '.[] | select(.Id == $value or .Name == $value) | .Id' \
            <<< "$spaces" | head -n 1)"
          projects="$(api_get "$OCTOPUS_URL/api/$space_id/projects/all")"
          project="$(jq -cer --arg name "$PROJECT" \
            '.[] | select(.Name == $name)' \
            <<< "$projects")"
          project_id="$(jq -er '.Id' <<< "$project")"
          releases="$(api_get "$OCTOPUS_URL/api/$space_id/projects/$project_id/releases")"
          old_release="$(jq -cer --arg version "$VERSION" \
            '[if type == "array" then .[] else .Items[]? end | select(.Version == $version)]' \
            <<< "$releases")"
          release_count="$(jq -er 'length' <<< "$old_release")"
          if [[ "$release_count" != "0" && "$release_count" != "1" ]]; then
            echo "::error::Expected at most one existing Octopus release $VERSION; found $release_count."
            exit 1
          fi

          old_release_id=""
          old_snapshot_id=""
          if [[ "$release_count" == "1" ]]; then
            old_release_id="$(jq -er '.[0].Id' <<< "$old_release")"
            CHANNEL_ID="$(jq -er '.[0].ChannelId' <<< "$old_release")"
            old_snapshot_id="$(jq -er '.[0].ProjectVariableSetSnapshotId' <<< "$old_release")"
            package_count="$(jq -er '.[0].SelectedPackages // [] | length' <<< "$old_release")"
            git_resource_count="$(jq -er '.[0].SelectedGitResources // [] | length' <<< "$old_release")"
            if [[ "$package_count" != "0" || "$git_resource_count" != "0" ]]; then
              echo "::error::Release $VERSION has package or Git-resource selections; refusing to recreate it automatically."
              exit 1
            fi

            octopus release delete \
              --project "$project_id" \
              --version "$VERSION" \
              --no-prompt
          fi

          if [[ -z "$CHANNEL_ID" ]]; then
            CHANNEL_ID="$(jq -r '.DefaultChannelId // empty' <<< "$project")"
          fi
          if [[ -z "$CHANNEL_ID" ]]; then
            echo "::error::No existing release channel or project default channel is available for $PROJECT; specify channel_id."
            exit 1
          fi
          if [[ -n "$CHANNEL_ID" ]]; then
            channel="$(api_get "$OCTOPUS_URL/api/$space_id/channels/$CHANNEL_ID")"
            channel_name="$(jq -er '.Name' <<< "$channel")"
            octopus release create \
              --project "$project_id" \
              --channel "$channel_name" \
              --version "$VERSION" \
              --no-prompt
          else
            octopus release create \
              --project "$project_id" \
              --version "$VERSION" \
              --no-prompt
          fi

          refreshed_releases="$(api_get "$OCTOPUS_URL/api/$space_id/projects/$project_id/releases")"
          new_release="$(jq -cer --arg version "$VERSION" \
            '[if type == "array" then .[] else .Items[]? end | select(.Version == $version)]' \
            <<< "$refreshed_releases")"
          if [[ "$(jq -er 'length' <<< "$new_release")" != "1" ]]; then
            echo "::error::Could not verify the recreated release $VERSION."
            exit 1
          fi
          new_release_id="$(jq -er '.[0].Id' <<< "$new_release")"
          new_snapshot_id="$(jq -er '.[0].ProjectVariableSetSnapshotId' <<< "$new_release")"
          if [[ -z "$new_snapshot_id" ||
                ( -n "$old_release_id" && "$new_release_id" == "$old_release_id" ) ||
                ( -n "$old_snapshot_id" && "$new_snapshot_id" == "$old_snapshot_id" ) ]]; then
            echo "::error::Octopus did not create a fresh release variable snapshot."
            exit 1
          fi
          echo "Recreated release $VERSION with a new project-variable snapshot."

      - name: Redeploy conductor release to Production
        if: inputs.deploy
        run: |
          octopus release deploy \
            --project "$PROJECT" \
            --version "$VERSION" \
            --environment "Production" \
            --no-prompt \
            --output-format basic \
            | octopus task wait
