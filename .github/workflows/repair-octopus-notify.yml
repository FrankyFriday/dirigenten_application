name: Repair Octopus notify step

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Confirm patching the Production Notify Server process step
        required: true
        type: choice
        options:
          - yes
      version:
        description: Existing conductor release version to redeploy
        required: true
        type: string
        default: "1.0.35"

permissions:
  contents: read

jobs:
  repair-and-deploy:
    runs-on: ubuntu-latest
    env:
      OCTOPUS_URL: https://franky.octopus.app
      OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
      OCTOPUS_SPACE: ${{ secrets.OCTOPUS_SPACE }}
      VERSION: ${{ inputs.version }}

    steps:
      - name: Patch the Notify Server release-version variable
        shell: bash
        run: |
          set -euo pipefail
          for name in OCTOPUS_API_KEY OCTOPUS_SPACE VERSION; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required setting $name is missing."
              exit 1
            fi
          done

          api_get() {
            curl --fail --silent --show-error \
              -H "X-Octopus-ApiKey: $OCTOPUS_API_KEY" \
              -H 'Accept: application/json' "$1"
          }

          spaces="$(api_get "$OCTOPUS_URL/api/spaces/all")"
          space_id="$(jq -er --arg value "$OCTOPUS_SPACE" \
            '.[] | select(.Id == $value or .Name == $value) | .Id' \
            <<< "$spaces" | head -n 1)"
          projects="$(api_get "$OCTOPUS_URL/api/$space_id/projects/all")"
          project_id="$(jq -er \
            '.[] | select(.Name == "dirigenten_application") | .Id' \
            <<< "$projects")"
          process_url="$OCTOPUS_URL/api/$space_id/projects/$project_id/deploymentprocess"
          process="$(api_get "$process_url")"
          old_count="$(jq -er \
            '[.Steps[] | select(.Name == "Notify Server") | .Actions[] | .. | strings | select(contains("#{Release.Version}"))] | length' \
            <<< "$process")"
          if [[ "$old_count" == "0" ]]; then
            echo "::error::The Notify Server step does not contain the failed Release.Version token."
            exit 1
          fi

          patched="$(jq --arg step "Notify Server" \
            '(.Steps[] | select(.Name == $step) | .Actions[]) |= walk(if type == "string" then gsub("#\\{Release\\.Version\\}"; "#{Octopus.Release.Number}") else . end)' \
            <<< "$process")"
          process_id="$(jq -er '.Id' <<< "$patched")"
          update_url="$OCTOPUS_URL/api/$space_id/deploymentprocesses/$process_id"
          curl --fail --silent --show-error \
            -X PUT \
            -H "X-Octopus-ApiKey: $OCTOPUS_API_KEY" \
            -H 'Content-Type: application/json' \
            --data-binary "$patched" \
            -o /dev/null "$update_url"

          verified="$(api_get "$process_url")"
          remaining="$(jq -er \
            '[.Steps[] | select(.Name == "Notify Server") | .Actions[] | .. | strings | select(contains("#{Release.Version}"))] | length' \
            <<< "$verified")"
          if [[ "$remaining" != "0" ]]; then
            echo "::error::Octopus process still contains the unresolved token."
            exit 1
          fi
          echo "Updated the Notify Server version token in the conductor Production process."

      - name: Install Octopus CLI
        uses: OctopusDeploy/install-octopus-cli-action@v3
        with:
          version: latest

      - name: Redeploy conductor release to Production
        run: |
          octopus release deploy \
            --project "dirigenten_application" \
            --version "$VERSION" \
            --environment "Production"
