name: Repair Octopus notify step

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Confirm patching the Production Notify Server process step
        required: true
        type: boolean
        default: false
      version:
        description: Existing conductor release version to redeploy
        required: true
        type: string
        default: "1.0.35"
      deploy:
        description: Start the Production deployment after repairing the process
        required: true
        type: boolean
        default: true
      channel_id:
        description: Existing Octopus channel ID to use if the release must be recreated
        required: true
        type: string
        default: Channels-41

permissions:
  contents: read

jobs:
  repair-and-deploy:
    runs-on: ubuntu-latest
    env:
      OCTOPUS_URL: https://franky.octopus.app
      OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
      OCTOPUS_SPACE: ${{ secrets.OCTOPUS_SPACE }}
      VERSION: ${{ inputs.version }}
      CONFIRM: ${{ inputs.confirm }}
      CHANNEL_ID: ${{ inputs.channel_id }}

    steps:
      - name: Patch the Notify Server release-version variable
        shell: bash
        run: |
          set -euo pipefail
          for name in OCTOPUS_API_KEY OCTOPUS_SPACE VERSION; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required setting $name is missing."
              exit 1
            fi
          done
          if [[ "$CONFIRM" != "true" ]]; then
            echo "::error::Set the confirm input to true to update the Production process."
            exit 1
          fi

          api_get() {
            curl --fail --silent --show-error \
              -H "X-Octopus-ApiKey: $OCTOPUS_API_KEY" \
              -H 'Accept: application/json' "$1"
          }

          spaces="$(api_get "$OCTOPUS_URL/api/spaces/all")"
          space_id="$(jq -er --arg value "$OCTOPUS_SPACE" \
            '.[] | select(.Id == $value or .Name == $value) | .Id' \
            <<< "$spaces" | head -n 1)"
          projects="$(api_get "$OCTOPUS_URL/api/$space_id/projects/all")"
          project="$(jq -cer \
            '.[] | select(.Name == "dirigenten_application")' \
            <<< "$projects")"
          process_id="$(jq -er '.DeploymentProcessId' <<< "$project")"
          process_url="$OCTOPUS_URL/api/$space_id/deploymentprocesses/$process_id"
          process="$(api_get "$process_url")"
          if ! jq -e '.Steps | type == "array"' <<< "$process" >/dev/null; then
            response_keys="$(jq -r 'keys | join(", ")' <<< "$process")"
            steps_type="$(jq -r '.Steps | type' <<< "$process")"
            echo "::error::Octopus returned an unexpected deployment-process shape (keys: $response_keys; Steps type: $steps_type)."
            exit 1
          fi
          old_count="$(jq -er \
            '[.Steps[] | select(.Name == "Notify Server") | .Actions[] | .. | strings | select(contains("#{Release.Version}"))] | length' \
            <<< "$process")"
          correct_count="$(jq -er \
            '[.Steps[] | select(.Name == "Notify Server") | .Actions[] | .. | strings | select(contains("#{Octopus.Release.Number}"))] | length' \
            <<< "$process")"
          if [[ "$old_count" == "0" && "$correct_count" == "0" ]]; then
            echo "::error::The Notify Server step contains neither the failed nor the expected release-version token."
            exit 1
          fi

          if [[ "$old_count" != "0" ]]; then
            patched="$(jq --arg step "Notify Server" \
              '(.Steps[] | select(.Name == $step) | .Actions[]) |= walk(if type == "string" then gsub("#\\{Release\\.Version\\}"; "#{Octopus.Release.Number}") else . end)' \
              <<< "$process")"
            curl --fail --silent --show-error \
              -X PUT \
              -H "X-Octopus-ApiKey: $OCTOPUS_API_KEY" \
              -H 'Content-Type: application/json' \
              --data-binary "$patched" \
              -o /dev/null "$process_url"
          else
            echo "The current Notify Server process already uses Octopus.Release.Number."
          fi

          verified="$(api_get "$process_url")"
          remaining="$(jq -er \
            '[.Steps[] | select(.Name == "Notify Server") | .Actions[] | .. | strings | select(contains("#{Release.Version}"))] | length' \
            <<< "$verified")"
          if [[ "$remaining" != "0" ]]; then
            echo "::error::Octopus process still contains the unresolved token."
            exit 1
          fi
          echo "Verified the Notify Server version token in the conductor Production process."
          variable_set_id="$(jq -er '.VariableSetId' <<< "$project")"
          variables="$(api_get "$OCTOPUS_URL/api/$space_id/variables/$variable_set_id")"
          echo "Matching Octopus project variable names (values intentionally withheld):"
          jq -r \
            '.Variables[]? | select(.Name | test("noten|server|api|key"; "i")) | [.Name, (.IsSensitive // false | tostring)] | @tsv' \
            <<< "$variables"
          echo "Notify Server action variable references:"
          jq -r \
            '[.Steps[] | select(.Name == "Notify Server") | .Actions[] | .Properties[]? | strings | scan("#\\{[^}]+\\}")] | unique | .[]' \
            <<< "$verified"

      - name: Install Octopus CLI
        if: inputs.deploy
        uses: OctopusDeploy/install-octopus-cli-action@v3
        with:
          version: latest

      - name: Recreate release with the updated Production variable snapshot
        if: inputs.deploy
        shell: bash
        run: |
          set -euo pipefail
          api_get() {
            curl --fail --silent --show-error \
              -H "X-Octopus-ApiKey: $OCTOPUS_API_KEY" \
              -H 'Accept: application/json' "$1"
          }

          spaces="$(api_get "$OCTOPUS_URL/api/spaces/all")"
          space_id="$(jq -er --arg value "$OCTOPUS_SPACE" \
            '.[] | select(.Id == $value or .Name == $value) | .Id' \
            <<< "$spaces" | head -n 1)"
          projects="$(api_get "$OCTOPUS_URL/api/$space_id/projects/all")"
          project="$(jq -cer \
            '.[] | select(.Name == "dirigenten_application")' \
            <<< "$projects")"
          project_id="$(jq -er '.Id' <<< "$project")"
          releases="$(api_get "$OCTOPUS_URL/api/$space_id/projects/$project_id/releases")"
          old_release="$(jq -cer --arg version "$VERSION" \
            '[if type == "array" then .[] else .Items[]? end | select(.Version == $version)]' \
            <<< "$releases")"
          release_count="$(jq -er 'length' <<< "$old_release")"
          if [[ "$release_count" != "0" && "$release_count" != "1" ]]; then
            echo "::error::Expected at most one existing Octopus release $VERSION; found $release_count."
            exit 1
          fi

          old_release_id=""
          old_snapshot_id=""
          if [[ "$release_count" == "1" ]]; then
            old_release_id="$(jq -er '.[0].Id' <<< "$old_release")"
            CHANNEL_ID="$(jq -er '.[0].ChannelId' <<< "$old_release")"
            old_snapshot_id="$(jq -er '.[0].ProjectVariableSetSnapshotId' <<< "$old_release")"
            package_count="$(jq -er '.[0].SelectedPackages // [] | length' <<< "$old_release")"
            git_resource_count="$(jq -er '.[0].SelectedGitResources // [] | length' <<< "$old_release")"
            if [[ "$package_count" != "0" || "$git_resource_count" != "0" ]]; then
              echo "::error::Release $VERSION has package or Git-resource selections; refusing to recreate it automatically."
              exit 1
            fi

            octopus release delete \
              --project "$project_id" \
              --version "$VERSION" \
              --no-prompt
          fi

          channel="$(api_get "$OCTOPUS_URL/api/$space_id/channels/$CHANNEL_ID")"
          channel_name="$(jq -er '.Name' <<< "$channel")"
          octopus release create \
            --project "$project_id" \
            --channel "$channel_name" \
            --version "$VERSION" \
            --no-prompt

          refreshed_releases="$(api_get "$OCTOPUS_URL/api/$space_id/projects/$project_id/releases")"
          new_release="$(jq -cer --arg version "$VERSION" \
            '[if type == "array" then .[] else .Items[]? end | select(.Version == $version)]' \
            <<< "$refreshed_releases")"
          if [[ "$(jq -er 'length' <<< "$new_release")" != "1" ]]; then
            echo "::error::Could not verify the recreated release $VERSION."
            exit 1
          fi
          new_release_id="$(jq -er '.[0].Id' <<< "$new_release")"
          new_snapshot_id="$(jq -er '.[0].ProjectVariableSetSnapshotId' <<< "$new_release")"
          if [[ -z "$new_snapshot_id" ||
                ( -n "$old_release_id" && "$new_release_id" == "$old_release_id" ) ||
                ( -n "$old_snapshot_id" && "$new_snapshot_id" == "$old_snapshot_id" ) ]]; then
            echo "::error::Octopus did not create a fresh release variable snapshot."
            exit 1
          fi
          echo "Recreated release $VERSION with a new project-variable snapshot."

      - name: Redeploy conductor release to Production
        if: inputs.deploy
        run: |
          octopus release deploy \
            --project "dirigenten_application" \
            --version "$VERSION" \
            --environment "Production" \
            --no-prompt \
            --output-format basic \
            | octopus task wait
